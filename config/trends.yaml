# Extra words that mark a Google-Trends / Wikipedia entry as in-niche, on top
# of the built-in finance list (engine/trends/text.py).
niche_keywords: []

# How much each source counts in the combined score (share of voice).
weights:
  news: 1.0       # how much of the business-news flow is about this topic
  gtrends: 1.0    # how much of India's trending search volume
  youtube: 1.0    # how much of the watched channels' fresh views (creators x creator_weight)

# Lifecycle thresholds — recent window vs the window before it.
lifecycle:
  rising_ratio: 1.3       # recent >= 1.3x previous  -> RISING
  fading_ratio: 0.7       # recent <= 0.7x previous  -> FADING
                          # anything in between -> PEAKING ("same")
  emerging_hours: 12      # EMERGING = first seen within this many hours...
  emerging_max_breadth: 5 # ...and carried by at most this many publishers/channels (not yet everywhere)
  dead_hours: 48          # no activity for this long -> dropped from the board
