# Trend tracker — free sources only (no API key needed for any of this).
# Edit freely; the collector re-reads this file on every run.

interval_minutes: 30      # how often the background collector runs while the app is up

# The time window everything is judged on: a topic's share of attention in the
# last `window_hours` against the `window_hours` before that. A story usually
# takes about a day to mature across news, YouTube and search, so the board
# compares whole days. `window_options` = the 1-day / 2-day switch in the
# dashboard; the first entry is the default.
window_hours: 24
window_options: [24, 48]

# Every `report_hours` an update is taken and stored for EACH window option:
# what is trending, the same, or fading — and how each topic moved since the
# previous update.
report_hours: 24
geo: IN                   # Google Trends + Wikipedia country

# Google News RSS. `topic` = a Google News section; `q` = a search query
# (Google's own operators work, e.g. when:1d). All of these are treated as
# in-niche, so keep them about your beat.
news:
  - topic: BUSINESS
  - q: "nifty OR sensex when:1d"
  - q: "stock market india when:1d"
  - q: "RBI OR SEBI when:1d"
  - q: "IPO india when:2d"
  - q: "Q2 results india shares NSE when:1d"
  - q: "FII OR rupee OR crude oil india when:1d"

# Publishers to drop entirely (exact name as shown in Google News) — for
# auto-generated or off-market outlets that pollute the board.
ignore_publishers:
  - Univest          # broker self-promotion posts, not news (seen 2026-10-06)

# YouTube channels to watch (free channel feed, includes view counts).
# group: creator = independent finance creators who pick what to cover by what
#                  is trending — their choices are a demand signal, so their
#                  views count `creator_weight` times in the YouTube score and
#                  their videos lead the "which titles are winning" lists;
#        news    = TV / publisher channels — they cover everything, every day.
# id = the channel's UC... id (the channel page's canonical link). Verified
# 2026-10-07 against each channel page; subscriber counts noted as a sanity check.
creator_weight: 2.0       # a creator's views count 2x ...
news_channel_weight: 0.5  # ... a news channel's 0.5x: creators count 4x as much as TV desks.
                          # News channels cover the whole day's agenda, not what is trending.
                          # Also: two news-channel clips alone no longer make a topic "real".
